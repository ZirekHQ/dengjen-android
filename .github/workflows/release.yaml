name: Release

# Push a vMAJOR.MINOR.PATCH tag whose version matches versionName in app/build.gradle.kts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Check the tag matches versionName
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match versionName $version" >&2
            exit 1
          fi
      - name: Fetch the dengjen AARs
        run: scripts/fetch-aars.sh
      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DENGJEN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the DENGJEN_KEYSTORE_BASE64 secret is not set; see RELEASING.md" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "DENGJEN_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the signed APK and bundle
        env:
          DENGJEN_KEYSTORE_PASSWORD: ${{ secrets.DENGJEN_KEYSTORE_PASSWORD }}
          DENGJEN_KEY_ALIAS: ${{ secrets.DENGJEN_KEY_ALIAS }}
          DENGJEN_KEY_PASSWORD: ${{ secrets.DENGJEN_KEY_PASSWORD }}
        run: ./gradlew --console=plain testReleaseUnitTest assembleRelease bundleRelease
      - name: Name the outputs after the version and checksum them
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/dengjen-android-$version.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/dengjen-android-$version.aab"
          (cd out && sha256sum ./* > SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.apk
      - name: Create the GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes out/*.apk out/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: out/*.aab
          if-no-files-found: error

  play:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The internal track only; promote to production by hand in the Play Console.
    environment: google-play
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.zirekhq.dengjen
          releaseFiles: "*.aab"
          track: internal
          status: completed
