# Draft recipe for fdroiddata (metadata/io.github.zirekhq.dengjen.yml). Not used by this
# repository's build; see docs/fdroid/README.md for how to submit it and what is still open.
Categories:
  - System
License: GPL-3.0-or-later
AuthorName: ZirekHQ
SourceCode: https://github.com/ZirekHQ/dengjen-android
IssueTracker: https://github.com/ZirekHQ/dengjen-android/issues
OpenCollective: zirek

AutoName: Dengjen

RepoType: git
Repo: https://github.com/ZirekHQ/dengjen-android.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y build-essential cmake libclang-dev ninja-build
    srclibs:
      - dengjen@v3.2.0
      - rustup@1.28.2
    ndk: r27c
    prebuild:
      - bash $$rustup$$/rustup-init.sh -y --profile minimal
      - source $HOME/.cargo/env
      # dengjen's rust-toolchain.toml pins its own Rust, so add the targets to that toolchain.
      - cd $$dengjen$$ && rustup target add aarch64-linux-android x86_64-linux-android
      - cargo install cargo-ndk --locked
    build:
      - source $HOME/.cargo/env
      - export ANDROID_NDK_HOME=$$NDK$$ ANDROID_HOME=$$SDK$$
      # ONNX Runtime from source in place of the sherpa-onnx prebuilt, and no STT module, which
      # links a prebuilt sherpa-onnx library.
      - $$dengjen$$/bindings/android/scripts/build-ort.sh
      - DENGJEN_ANDROID_STT=0 $$dengjen$$/bindings/android/scripts/build-jni.sh release
      - (cd $$dengjen$$/bindings/android && ./gradlew :core:assembleRelease :tts:assembleRelease)
      - mkdir -p ../libs
      - cp $$dengjen$$/bindings/android/core/build/outputs/aar/core-release.aar ../libs/dengjen-android-core.aar
      - cp $$dengjen$$/bindings/android/tts/build/outputs/aar/tts-release.aar ../libs/dengjen-android-tts.aar
    gradle:
      - yes

# Off, because a new app tag may need a new dengjen srclib (dengjen.lock), which an automatic
# update would not change. Add each build entry by hand with the matching srclib.
AutoUpdateMode: None
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.1.0
CurrentVersionCode: 1
